[package]
name = "wispertype"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wispertype"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cpal = "0.15"
hound = "3.5"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
gtk4 = "0.8"
libadwaita = "0.6"
